<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc"><title id="title">Active Directory Learning Studio interface preview</title><desc id="desc">Illustrated landing page with three learning paths.</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#173c61"/><stop offset="1" stop-color="#071a30"/></linearGradient><linearGradient id="card" x2="0" y2="1"><stop stop-color="#245980"/><stop offset="1" stop-color="#10334f"/></linearGradient></defs><rect width="1200" height="750" fill="url(#bg)"/><rect width="1200" height="92" fill="#225679" opacity=".65"/><rect x="54" y="17" width="60" height="60" rx="15" fill="#102e52"/><path d="m84 25 21 12-21 12-21-12z" fill="#71f1ff"/><path d="m63 43 21 12 21-12v8L84 63 63 51z" fill="#2fbbf1"/><path d="m63 57 21 12 21-12v8L84 77 63 65z" fill="#2080d8"/><g font-family="Arial,sans-serif"><text x="133" y="48" fill="#fff" font-weight="bold" font-size="28">Active Directory Learning Studio</text><text x="134" y="73" fill="#bfebf9" font-size="16">Learn • Visualize • Understand • Explain</text><text x="67" y="183" fill="#71dcee" letter-spacing="3" font-weight="bold" font-size="17">EXPLORE ACTIVE DIRECTORY</text><text x="64" y="280" fill="#fff" font-weight="bold" font-size="56">Learn the concepts.</text><text x="64" y="349" fill="#69ddf5" font-weight="bold" font-size="56">Understand the</text><text x="64" y="418" fill="#69ddf5" font-weight="bold" font-size="56">architecture.</text><text x="68" y="467" fill="#bed8e9" font-size="20">Interactive learning through connected scenarios,</text><text x="68" y="498" fill="#bed8e9" font-size="20">visual explanations and architecture decisions.</text><rect x="65" y="536" width="253" height="59" rx="10" fill="#d9faf4"/><text x="84" y="572" font-size="18" fill="#173f60" font-weight="bold">Explore Learning Paths →</text><text x="67" y="693" font-size="33" font-weight="bold" fill="#fff">11</text><text x="118" y="689" fill="#c7dfec" font-size="1